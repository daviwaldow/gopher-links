# Roda automaticamente em todo push e pull request.
# Escaneia o repositorio inteiro (incluindo historico) procurando por
# segredos vazados por engano (chaves de API, senhas, tokens).
# Gratuito - GitHub Actions inclui 2000 min/mes no plano free.
name: Verificacao de segredos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gitleaks-action precisa ler o conteudo e, em pull_request, listar os commits
# do PR. Sem pull-requests: read, o passo falha com 403 (nao e vazamento).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessario para escanear todo o historico

      - name: Escanear segredos com gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
