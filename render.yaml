# Blueprint do Render: descreve o serviço pra eu não precisar configurar tudo
# na mão no painel. Ao conectar o repositório no Render, ele lê esse arquivo e
# já sobe o backend a partir do Dockerfile.
services:
  - type: web
    name: gopher-links
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Restringe quem pode chamar a API via navegador (CORS) ao frontend no
      # Firebase Hosting. Aceita uma lista separada por vírgula, ex.:
      # "https://gopherlinks.web.app,http://localhost:8080". Use "*" só pra
      # teste. Obs.: alterar aqui só vale no Render se o Blueprint estiver
      # sincronizando; senão, ajuste também em Environment no painel do Render.
      - key: ALLOWED_ORIGIN
        value: "https://gopherlinks.web.app"
      # Connection string do Postgres (ex.: Neon/Supabase). Marcado como
      # sync:false pra NUNCA ficar no repositório — o valor é colado à mão em
      # Environment no painel do Render. Sem essa variável, o app usa store em
      # memória (os links somem a cada reinício).
      - key: DATABASE_URL
        sync: false
