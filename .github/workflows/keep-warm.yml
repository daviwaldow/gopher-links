# Mantem a API do Render acordada: o free tier hiberna apos ~15 min de
# inatividade e demora ~30-60s pra voltar. Este job "cutuca" o /healthz
# a cada 10 min pra o usuario nunca pegar o cold start.
#
# Observacoes:
# - O agendador do GitHub Actions e "best-effort": pode atrasar alguns
#   minutos. Para algo mais preciso, um pinger externo (UptimeRobot,
#   cron-job.org) e mais confiavel - mas isto ja resolve na maior parte.
# - O GitHub desabilita workflows agendados apos 60 dias sem atividade no
#   repo; num projeto em desenvolvimento ativo isso nao acontece.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 minutos
  workflow_dispatch: {} # permite rodar manualmente pelo painel do GitHub

# Se um ping ainda estiver rodando (cold start lento), nao acumula outro.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="https://gopher-links.onrender.com/healthz"
          # Ate 4 tentativas: a 1a apos hibernar pode levar ~50s (por isso
          # --max-time 90). Assim que responder 200, encerra com sucesso.
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo 000)
            echo "tentativa $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API acordada."
              exit 0
            fi
            sleep 15
          done
          # Nao falha o job por lentidao de cold start (evita e-mails de erro):
          # o objetivo e so acordar o servico, o proximo ciclo tenta de novo.
          echo "Sem 200 apos as tentativas; proximo ciclo tenta novamente."
